# Standard R-CMD-check workflow (r-lib v2 actions).
# Source: https://github.com/r-lib/actions/blob/v2-branch/examples/check-standard.yaml
#
# Check development branches before they reach main. Build and install the
# package under all five R/OS combinations, then run examples and testthat
# through R CMD check. Keep job names stable: main requires these checks.

name: R-CMD-check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

permissions: read-all

# Cancel superseded commits within a branch or PR, keeping push and PR runs
# separate so a branch run cannot cancel the required merge-result checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # pak cannot extract the Zstd-compressed CRAN macOS binaries of
          # knitr/xfun yet; request source for these two dependencies only.
          - {os: macos-latest,   r: 'release', extra-packages: 'knitr=?source, xfun=?source'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
