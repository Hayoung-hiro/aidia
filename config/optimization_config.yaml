# =============================================================================
# DIA Window Optimizer Configuration (YAML Format)
# =============================================================================
# Primary configuration format (recommended for readability and editability)
# For JSON format (legacy), see optimization_config.json
# =============================================================================

# Project Metadata
project_metadata:
  project_name: "Fusion_Lumos_70pct_Satisfaction"
  date: "2025-11-17"
  description: "DIA window optimization for Fusion Lumos with 70% satisfaction target"
  analyst: "User"

# Input Data Configuration
input_data:
  # Input files: List of DIA-NN report files (parquet/tsv/csv)
  input_files:
    - "data/30min_report.parquet"
    - "data/60min_report.parquet"
    - "data/90min_report.parquet"

  # Current cycle time (seconds)
  # - null: Auto-estimate from gradient length (recommended)
  # - numeric: Use provided value for DPPP diagnosis
  current_cycle_time: null

  # Technical Replicate Handling
  # - Automatically detects multiple runs from 'Run' column
  # - Computes median FWHM across replicates
  # - Filters precursors by intensity CV%
  enable_replicate_consensus: true
  min_replicates: 1  # Keep singletons (default: 1)
  max_intensity_cv_percent: 30  # Geometric CV% threshold

  # Note: Column selection is AUTOMATIC
  # Always keeps: Precursor.Id, RT.Start, Precursor.Mz, FWHM, Protein.Group
  # Typical memory savings: ~80% (40 columns → 5-10 columns)

# Instrument Configuration
instrument:
  # Preset options:
  # - astral: Thermo Astral (ultra-high speed, 50-100 Hz)
  # - fusion_lumos: Thermo Fusion Lumos (high resolution, 25-40 Hz)
  # - orbitrap: Traditional Orbitrap (8-12 Hz)
  # - orbitrap_exploris: Orbitrap Exploris (modern, 25-40 Hz)
  # - timstof: Bruker TimsTOF (PASEF mode)
  # - sciex_7600: SCIEX ZenoTOF 7600
  # - custom: Use custom_settings below
  preset: "fusion_lumos"

  # Custom settings (optional, only if preset = "custom")
  custom_settings: null

# DPPP (Data Points Per Peak) Parameters
dppp_parameters:
  # Target DPPP modes:
  # - 7.0: Quant Mode (optimal quantification accuracy, recommended)
  # - 1.5: ID Mode (maximum precursor identification)
  # - 4.0: Balanced Mode (compromise between ID and Quant)
  target_dppp: 7.0

  # Target satisfaction ratio (0.50-0.95)
  # Percentage of precursors that should meet target DPPP
  # Common values: 0.70 (standard), 0.85 (stringent), 0.60 (lenient)
  target_satisfaction: 0.70

  # DPPP tolerance (0.0-2.0)
  # Allowed deviation from target DPPP (0.0 = strict)
  dppp_tolerance: 0.0

# Scan Settings
scan_settings:
  # Load factor (0.50-1.00)
  # Instrument capacity utilization (0.80 = 80% capacity, recommended)
  load_factor: 0.8

  # MS1 scans per cycle (null or 0/1)
  # null: Auto-detect based on instrument preset
  # 0: MS1-free DIA (not recommended)
  # 1: Standard DIA with MS1 survey scan (recommended)
  ms1_scans_per_cycle: null

  # Warning threshold for low window count
  # Alert if windows per RT bin falls below this value
  warning_threshold_windows: 5

# RT (Retention Time) Binning
rt_binning:
  # RT bin width in minutes (1.0-30.0)
  # Defines time segments for RT-dependent window optimization
  # Common values: 5.0 (standard), 2.0 (high resolution), 10.0 (fast)
  rt_bin_width_min: 5.0

# m/z Optimization Strategies
mz_optimization:
  # Strategies to generate (array of 1-5 strategies)
  # Available: greedy, kde, quantile, coverage, outlier
  #
  # Strategy comparison:
  # - greedy: MacCoss Lab sliding window (GLOBAL, recommended) → adaptive width
  # - kde: Kernel Density Estimation peak-based (GLOBAL) → focused on dense regions
  # - quantile: Fast, robust (P5-P95 range) → 14-16 Da, 90-92% coverage
  # - outlier: Maximum coverage with outlier removal → 18-20 Da, 96-97% coverage
  # - coverage: Balanced coverage optimization → 17 Da, 95% coverage
  strategies:
    - "greedy"
    - "kde"
    - "quantile"
    - "outlier"
    - "coverage"

  # Quantile strategy parameters
  quantile_lower: 0.05  # P5 (lower 5th percentile)
  quantile_upper: 0.95  # P95 (upper 95th percentile)

  # Coverage strategy parameters
  target_coverage: 0.95  # 95% precursor coverage

  # Outlier strategy parameters
  outlier_threshold: 3.0  # 3 SD from median (Tukey's method)

  # Smoothing strategy parameters
  smoothing_window: 3  # Savitzky-Golay window size (odd number, 3-15)
  polynomial_order: 2  # Polynomial order for smoothing (1-5)

# Window Generation
window_generation:
  # Window generation modes (array of 1-2 modes)
  # - variable: Density-adaptive windows (recommended, best for complex samples)
  # - fixed: Equal-width windows (simpler, best for uniform samples)
  modes:
    - "variable"

  # Window width constraints (Da)
  min_width_da: 2   # Minimum isolation window width (2 Da for narrow-DIA)
  max_width_da: 80  # Maximum isolation window width (prevent excessive width)

  # Overlap between adjacent windows (0-50%)
  # 0% = no overlap (recommended)
  # 10-20% = slight overlap for edge effects
  overlap_percentage: 0

# Output Configuration
output:
  # Output directory (relative or absolute path)
  output_dir: "results"

  # Generate batch processing summary CSV
  include_summary: true

  # Generate visualizations (24 plots per gradient)
  # Plots include: DPPP density, RT allocation, coverage heatmap, etc.
  # Warning: Significantly increases processing time (~2-5 min per gradient)
  include_plots: true

# =============================================================================
# Usage Instructions
# =============================================================================
# 1. Edit this file with your parameters
# 2. Run optimization:
#      source("run_with_config.R")
#      results <- run_optimization("config/optimization_config.yaml")
#
# 3. Or use interactive builder:
#      source("scripts/config_builder.R")
#      config <- run_config_builder()
#
# =============================================================================
# Expected Output Structure
# =============================================================================
# results/
# ├── 30min/
# │   ├── quantile_variable_method.csv  (Thermo-compatible method file)
# │   ├── greedy_density_method.csv
# │   ├── outlier_variable_method.csv
# │   ├── coverage_variable_method.csv
# │   ├── plot01_dppp_density_distribution.png
# │   ├── plot02_rt_window_allocation.png
# │   ├── ... (24 plots total)
# │   └── optimization_report.pdf
# ├── 60min/ (same structure)
# ├── 90min/ (same structure)
# └── batch_processing_summary.csv  (comparison table)
#
# =============================================================================
