# =============================================================================
# Production Test Configuration - Complete Pipeline with Visualization
# =============================================================================
# Purpose: Full-scale test with all gradients, strategies, and plots
# Dataset: 30min, 60min, 90min gradients (3 files)
# Strategies: All 5 strategies (greedy, kde, quantile, outlier, coverage)
# Output: Method files + 24 plots per gradient + PDF reports
# Expected runtime: 10-15 minutes
# =============================================================================

project_metadata:
  project_name: "Production_Test_All_Gradients"
  date: "2025-11-17"
  description: "Full production test with all gradients and visualization suite"
  analyst: "Claude"

input_data:
  # All three gradient files
  input_files:
    - "data/30min_report.parquet"
    - "data/60min_report.parquet"
    - "data/90min_report.parquet"

  # Auto-estimate cycle time from gradient length
  current_cycle_time: null

  # Enable replicate consensus
  enable_replicate_consensus: true
  min_replicates: 1
  max_intensity_cv_percent: 30

instrument:
  preset: "fusion_lumos"
  custom_settings: null

dppp_parameters:
  # Quant Mode (7.0) - Optimal for quantification accuracy
  target_dppp: 7.0

  # 70% satisfaction - Standard threshold
  target_satisfaction: 0.70

  dppp_tolerance: 0.0

scan_settings:
  load_factor: 0.8
  ms1_scans_per_cycle: null
  warning_threshold_windows: 5

rt_binning:
  # 5-minute RT bins (standard)
  rt_bin_width_min: 5.0

mz_optimization:
  # Test ALL 5 strategies for comprehensive comparison
  strategies:
    - "greedy"
    - "kde"
    - "quantile"
    - "outlier"
    - "coverage"

  # Strategy parameters
  quantile_lower: 0.05
  quantile_upper: 0.95
  target_coverage: 0.95
  outlier_threshold: 3.0
  smoothing_window: 3
  polynomial_order: 2

window_generation:
  # Variable mode (density-adaptive, recommended)
  modes:
    - "variable"

  min_width_da: 2
  max_width_da: 80
  overlap_percentage: 0

output:
  output_dir: "results_production_test"
  include_summary: true

  # Enable full visualization suite (24 plots per gradient)
  include_plots: true

# =============================================================================
# Expected Output Structure
# =============================================================================
# results_production_test/
# ├── 30min/
# │   ├── quantile_variable_method.csv
# │   ├── greedy_density_method.csv
# │   ├── outlier_variable_method.csv
# │   ├── coverage_variable_method.csv
# │   ├── plot01_dppp_density_distribution.png
# │   ├── plot02_rt_window_allocation.png
# │   ├── ... (24 plots total)
# │   └── optimization_report.pdf
# ├── 60min/ (same structure)
# ├── 90min/ (same structure)
# └── batch_processing_summary.csv
#
# Total files: 12 method CSVs + 72 plots + 3 PDFs + 1 summary
# =============================================================================
